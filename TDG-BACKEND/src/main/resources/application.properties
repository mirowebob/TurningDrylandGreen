spring.application.name=TDG-BACKEND
server.port=8082

# Supabase PostgreSQL Connection (Using IPv4 Pooler)
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.kxhirgxuuqcamvbohzqs
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Align connection lifetimes with cloud poolers
# 1. Clean up named statements when connections reset
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueriesPerConnection=0

# 2. Tell Hikari to test if a connection is alive before using it
spring.datasource.hikari.connection-test-query=SELECT 1

# 3. Reduce connection lifetimes (solves the "connection has been closed" warning)
# Max lifetime should be slightly shorter than your database's connection timeout (usually 30 mins)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# 4. If you use a pgbouncer or connection proxy, disable server-side caching entirely
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.validation-timeout=3000


# JPA and Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

kcb.buni.base-url:${BUNI_BASE_URL:https://uat.buni.kcbgroup.com}
kcb.buni.consumer-key:${BUNI_CONSUMER_KEY:some-string}
kcb.buni.consumer-secret:${BUNI_CONSUMER_SECRET}
kcb.buni.org-short-code:${SHORTCODE:522522}
kcb.buni.org-pass-key:${ORG_PASS_KEY}
kcb.buni.shared-short-code:${SHARED_SHORT_CODE:true}
kcb.buni.callback-url:${CALLBACK_URL}
kcb.buni.ipn-signature-key:${BUNI_IPN_SIGNATURE_KEY}

logging.level.com.tgd.kcbbuni:INFO
